name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test backend
        working-directory: backend
        run: ./mvnw -B clean test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  e2e-smoke:
    # Jornada da demonstração contra o backend real: a API só responde com a sessão da conta de demonstração.
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: comercialcloud
          POSTGRES_USER: comercialcloud
          POSTGRES_PASSWORD: comercialcloud-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comercialcloud -d comercialcloud"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DEMO_SENHA: senha-publica-da-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend in demo mode
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          # Segredo descartável, gerado a cada execução e nunca impresso.
          export COMERCIAL_CLOUD_DEMO_SESSION_SECRET="$(openssl rand -hex 32)"
          export COMERCIAL_CLOUD_TENANT_RESOLUTION=demo
          export COMERCIAL_CLOUD_DEMO_SENHA="$E2E_DEMO_SENHA"
          export COMERCIAL_CLOUD_KEYCLOAK_PROVISIONING_ENABLED=false
          export QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/comercialcloud
          export QUARKUS_DATASOURCE_USERNAME=comercialcloud
          export QUARKUS_DATASOURCE_PASSWORD=comercialcloud-ci
          export QUARKUS_HTTP_CORS_ORIGINS=http://localhost:3000
          export COMERCIALCLOUD_UPLOAD_DIR="$RUNNER_TEMP/uploads"
          nohup java -jar target/quarkus-app/quarkus-run.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          npx --yes wait-on http://localhost:8080/q/health/ready --timeout 120000 || { tail -50 "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: Build and start frontend in demo mode
        working-directory: frontend
        env:
          NEXT_PUBLIC_AUTH_MODE: demo
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_DEMO_EMAIL: admin@demo.com
          NEXT_PUBLIC_DEMO_SENHA: ${{ env.E2E_DEMO_SENHA }}
        run: |
          npm ci
          npm run build
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright journey
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8080

      - name: Backend log on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/backend.log"

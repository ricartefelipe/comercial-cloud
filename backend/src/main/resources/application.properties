quarkus.liquibase.change-log=db/changeLog.xml
quarkus.liquibase.migrate-at-start=true
comercialcloud.upload.dir=uploads/produtos

# CORS do painel. Fica aqui, e nao em application.yml, porque o projeto nao inclui a extensao
# quarkus-config-yaml: o YAML nao e lido pelo Quarkus e as chaves de CORS declaradas nele nunca
# valeram, bloqueando as chamadas do painel (outra origem) a partir do navegador.
quarkus.http.cors=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-tenant-id,x-user-id,x-correlation-id
quarkus.http.cors.exposed-headers=x-correlation-id

# De onde vêm locatário e usuário: jwt (token validado), demo (fixos no servidor) ou header (só desenvolvimento).
comercial-cloud.tenant.resolution=${COMERCIAL_CLOUD_TENANT_RESOLUTION:jwt}
%dev.comercial-cloud.tenant.resolution=${COMERCIAL_CLOUD_TENANT_RESOLUTION:header}
%test.comercial-cloud.tenant.resolution=header

quarkus:
  application:
    name: comercial-cloud
  http:
    port: 8080
    cors:
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: accept,authorization,content-type,x-tenant-id,x-user-id,x-correlation-id
      exposed-headers: x-correlation-id
  datasource:
    db-kind: postgresql
    username: comercialcloud
    password: comercialcloud
    jdbc:
      url: jdbc:postgresql://localhost:5432/comercialcloud
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  liquibase:
    migrate-at-start: true
    change-log: db/changelog/db.changelog-master.yaml
  smallrye-openapi:
    info-title: ComercialCloud API
    info-version: 1.0.0
    info-description: API SaaS multitenant para PDV e retaguarda comercial
  swagger-ui:
    always-include: true
    path: /q/swagger-ui
  log:
    console:
      json: false
    category:
      "com.comercialcloud":
        level: INFO
  smallrye-jwt:
    enabled: false
  micrometer:
    export:
      prometheus:
        path: /metrics
  mailer:
    from: ${MAIL_FROM:noreply@comercialcloud.local}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    ssl: false
    start-tls: ${MAIL_STARTTLS:DISABLED}

comercial-cloud:
  fiscal:
    enabled: true
    provider: sandbox
    focusnfe:
      enabled: false
      token: ${FOCUSNFE_TOKEN:}
      base-url-homologacao: https://homologacao.focusnfe.com.br
      base-url-producao: https://api.focusnfe.com.br
    modelo-padrao: NFCE
    max-tentativas: 5
    scheduler:
      every: 10s
  billing:
    enabled: true
    gateway: sandbox
    sandbox-comportamento: APROVAR_SEMPRE
    asaas:
      enabled: false
      api-key: ${ASAAS_API_KEY:}
      base-url: https://api-sandbox.asaas.com/v3
      webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    plano-padrao: ESSENCIAL
    trial-dias: 14
    max-tentativas: 3
    vencimento-dias: 5
    scheduler:
      faturamento-every: 1h
      cobranca-every: 30m
  onboarding:
    seed-demo: true
  keycloak:
    provisioning:
      enabled: false
    server-url: http://localhost:8180
    realm: comercialcloud
    admin-client-id: comercial-cloud-api
    admin-client-secret: comercial-cloud-api-secret
  mail:
    enabled: false
    from: ${MAIL_FROM:noreply@comercialcloud.local}
    app-url: ${APP_URL:http://localhost:3000}

"%test":
  quarkus:
    mailer:
      mock: true

"%dev":
  quarkus:
    mailer:
      mock: true

"%auth":
  quarkus:
    oidc:
      auth-server-url: http://localhost:8180/realms/comercialcloud
      client-id: comercial-cloud-api
    smallrye-jwt:
      enabled: true
    http:
      auth:
        permission:
          health:
            paths: /q/health,/q/health/*
            policy: permit
          metrics:
            paths: /metrics
            policy: permit
  mp:
    jwt:
      verify:
        publickey:
          location: META-INF/resources/publicKey.pem

databaseChangeLog:
  - changeSet:
      id: 019-assinatura-tenant
      author: comercialcloud
      changes:
        - createTable:
            tableName: assinatura_tenant
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assinatura_tenant_tenant
                    references: tenant(id)
              - column:
                  name: plano_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assinatura_tenant_plano
                    references: plano_assinatura(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: inicio
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: proxima_cobranca
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: trial_fim
                  type: DATE
              - column:
                  name: tentativas_falha
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            constraintName: uk_assinatura_tenant
            tableName: assinatura_tenant
            columnNames: tenant_id

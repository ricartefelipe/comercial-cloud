databaseChangeLog:
  - changeSet:
      id: 020-fatura-assinatura
      author: comercialcloud
      changes:
        - createTable:
            tableName: fatura_assinatura
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fatura_assinatura_tenant
                    references: tenant(id)
              - column:
                  name: assinatura_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fatura_assinatura_assinatura
                    references: assinatura_tenant(id)
              - column:
                  name: competencia
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: valor
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: vencimento
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: tentativas
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: transacao_ref
                  type: VARCHAR(100)
              - column:
                  name: motivo_recusa
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: paga_em
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            constraintName: uk_fatura_assinatura_competencia
            tableName: fatura_assinatura
            columnNames: tenant_id, assinatura_id, competencia
        - createIndex:
            indexName: idx_fatura_assinatura_status
            tableName: fatura_assinatura
            columns:
              - column:
                  name: status

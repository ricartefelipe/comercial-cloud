databaseChangeLog:
  - changeSet:
      id: 025-produto-imagem-url
      author: comercialcloud
      changes:
        - addColumn:
            tableName: produto
            columns:
              - column:
                  name: imagem_url
                  type: varchar(500)

  - changeSet:
      id: 025-estoque-quantidade-minima
      author: comercialcloud
      changes:
        - addColumn:
            tableName: estoque
            columns:
              - column:
                  name: quantidade_minima
                  type: decimal(15, 3)
                  defaultValueNumeric: 10
                  constraints:
                    nullable: false

  - changeSet:
      id: 025-seed-demo-imagens-produto

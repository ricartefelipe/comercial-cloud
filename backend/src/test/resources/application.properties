quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:comercialcloud-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.devservices.enabled=false
quarkus.liquibase.migrate-at-start=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.smallrye-jwt.enabled=false
# Os testes autenticam por cabeçalho: sem isso, o Quarkus sobe um Keycloak por Testcontainers, cujo cliente Docker os runners atuais recusam.
quarkus.oidc.enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.scheduler.enabled=false
comercial-cloud.billing.vencimento-dias=0
quarkus.http.test-port=0

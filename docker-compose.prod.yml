# Stack produção / piloto AWS — EC2 + Docker Compose + Nginx + Keycloak OIDC.
# Uso:
#   cp .env.aws-pilot.example .env.aws-pilot && editar secrets
#   ./scripts/generate-keycloak-realm-prod.sh https://SEU-DOMINIO
#   docker compose --env-file .env.aws-pilot -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comercialcloud
      POSTGRES_USER: comercialcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercialcloud -d comercialcloud"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --import-realm --hostname=${DOMAIN} --http-relative-path=/auth --http-enabled=true --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: comercialcloud
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${DOMAIN:?defina DOMAIN}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-prod.json:/opt/keycloak/data/import/realm-comercialcloud.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/comercialcloud
      QUARKUS_DATASOURCE_USERNAME: comercialcloud
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_PROFILE: auth
      QUARKUS_HTTP_CORS_ORIGINS: ${APP_URL:?defina APP_URL}
      QUARKUS_OIDC_AUTH_SERVER_URL: ${KEYCLOAK_ISSUER_URL:?defina KEYCLOAK_ISSUER_URL}
      QUARKUS_OIDC_CLIENT_ID: comercial-cloud-api
      QUARKUS_OIDC_CREDENTIALS_SECRET: comercial-cloud-api-secret
      COMERCIAL_CLOUD_KEYCLOAK_PROVISIONING_ENABLED: ${COMERCIAL_CLOUD_KEYCLOAK_PROVISIONING_ENABLED:-true}
      COMERCIAL_CLOUD_KEYCLOAK_SERVER_URL: ${KEYCLOAK_PUBLIC_URL:?defina KEYCLOAK_PUBLIC_URL}
      COMERCIAL_CLOUD_BILLING_ASAAS_ENABLED: ${COMERCIAL_CLOUD_BILLING_ASAAS_ENABLED:-false}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      COMERCIAL_CLOUD_FISCAL_FOCUSNFE_ENABLED: ${COMERCIAL_CLOUD_FISCAL_FOCUSNFE_ENABLED:-false}
      FOCUSNFE_TOKEN: ${FOCUSNFE_TOKEN:-}
      COMERCIAL_CLOUD_MAIL_ENABLED: ${COMERCIAL_CLOUD_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
        NEXT_PUBLIC_KEYCLOAK_REALM: comercialcloud
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: comercial-cloud-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/default-pilot-active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:

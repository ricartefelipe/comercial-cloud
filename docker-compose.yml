services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: comercialcloud-postgres
    environment:
      POSTGRES_DB: comercialcloud
      POSTGRES_USER: comercialcloud
      POSTGRES_PASSWORD: comercialcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercialcloud -d comercialcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Keycloak 26.8.1 com a Guava corrigida (infra/images/keycloak.Dockerfile).
    build:
      context: ./infra/images
      dockerfile: keycloak.Dockerfile
    container_name: comercialcloud-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/comercialcloud
      KC_DB_USERNAME: comercialcloud
      KC_DB_PASSWORD: comercialcloud
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      # Só o realm de desenvolvimento: a pasta também tem o modelo de produção, com o mesmo realm, e importar os dois falha.
      - ./infra/keycloak/realm-comercialcloud.json:/opt/keycloak/data/import/realm-comercialcloud.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - keycloak

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comercialcloud-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/comercialcloud
      QUARKUS_DATASOURCE_USERNAME: comercialcloud
      QUARKUS_DATASOURCE_PASSWORD: comercialcloud
      QUARKUS_HTTP_PORT: 8080
      COMERCIAL_CLOUD_TENANT_RESOLUTION: header
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        # Desenvolvimento local, sem Keycloak: o backend acima identifica por cabeçalho.
        NEXT_PUBLIC_AUTH_MODE: header
    container_name: comercialcloud-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
